    - Entity Framework Core
    - Node.js
    - Azure
    - CI/CD
    - GitHub Actions
    - Unit Testing
    - Git
    - SQL
  familiar:
    - Docker
    - Kubernetes
    - AWS
    - Terraform
    - Redis
    - GraphQL

