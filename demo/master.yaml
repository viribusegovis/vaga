# Alex Example's CV — the fictional person the demo runs as.
#
# Same shape as cv/master.example.yaml, filled in. Alex is the persona already
# used by cv/applications/_demo, so the tailored CV in the demo matches the
# person the jobs are being scored against.
#
# Nothing here is real. Employers are Microsoft's standard fictional
# placeholders; dates, projects and numbers are invented.

profile:
  name: Alex Example
  title: Junior Fullstack Developer
  phone: "+351 900 000 000"
  email: alex@example.com
  location: Lisbon, Portugal
  github: github.com/alexexample
  linkedin: linkedin.com/in/alexexample
  photo: assets/avatar-placeholder.png

about:
  - id: opener
    text: >-
      Software engineering graduate looking for a first full-time role on a
      backend or platform team.
  - id: philosophy
    text: >-
      I prefer boring, well-tested solutions over clever ones, and I'd rather
      understand a system end to end than move fast through the parts I know.

languages:
  - {name: English, level: Native, dots: 5}
  - {name: Portuguese, level: Professional, dots: 4}
  - {name: Spanish, level: Professional, dots: 4}
  - {name: German, level: Basic, dots: 2}

# Tiered pools. A core hit is worth 3x a familiar one when scoring, so this is
# the file that decides the ranking as much as the postings do.
